<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta para mi niña 💗</title>
    <style>
        /* Centrado total en la pantalla */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #fce4ec;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Contenedor principal que evita que la carta se "salga" */
        .card-container {
            position: relative;
            width: 350px;
            height: 500px;
            perspective: 1500px; /* Profundidad para el giro */
        }

        /* La carta en sí */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: left; /* Eje de giro a la izquierda */
        }

        /* Abrir la carta al pasar el mouse */
        .card-container:hover .card {
            transform: rotateY(-160deg);
        }

        /* Caras de la carta */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 15px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.1);
        }

        /* Portada (Rosa) */
        .front {
            background-color: #ff85a2;
            z-index: 2;
            color: white;
            border: 2px solid #f07090;
        }

        .front h2 {
            font-size: 28px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        /* Interior (Blanco/Rosa suave) */
        .inside {
            background-color: #ffffff;
            transform: rotateY(180deg); /* Volteada por defecto */
            z-index: 1;
            border: 2px solid #ff85a2;
        }

        /* Contenido del mensaje */
        .content {
            text-align: center;
            width: 100%;
        }

        .content h1 {
            color: #d81b60;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .content p {
            color: #444;
            font-size: 18px;
            line-height: 1.5;
        }

        .cake {
            font-size: 70px;
            margin: 15px 0;
            display: block;
        }

        .footer {
            color: #ff1493;
            font-weight: bold;
            font-size: 20px;
            margin-top: 15px;
        }

        /* Fondo de la base para que no se vea vacío al abrir */
        .card-base {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fffafa;
            border-radius: 15px;
            z-index: 0;
            border: 2px solid #ff85a2;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Parte de atrás fija (lo que queda en la mesa al abrir) -->
        <div class="card-base">
             <div class="content">
                <span class="cake">🎂</span>
                <p class="footer">¡Disfruta tu día!</p>
             </div>
        </div>

        <!-- La parte que se mueve (Portada e Interior) -->
        <div class="card">
            <!-- PORTADA -->
            <div class="face front">
                <h2>¡Feliz Cumpleaños!</h2>
                <span style="font-size: 50px;">🎁</span>
                <p>Tocame para abrir</p>
            </div>

            <!-- INTERIOR -->
            <div class="face inside">
                <div class="content">
                    <h1>¡Feliz cumple mi niña!</h1>
                    <p>Que la pases muy lindo en tu día y t amo muchooooo 💗</p>
                    <span class="cake">🎂</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
