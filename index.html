<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi niña 💗</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffeef2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Contenedor de la tarjeta */
        .card {
            position: relative;
            width: 400px;
            height: 550px;
            cursor: pointer;
            perspective: 1500px;
            transition: transform 0.5s;
        }

        /* El cuerpo de la tarjeta (las dos mitades) */
        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        /* Al pasar el mouse, se abre como un libro */
        .card:hover .card-inner {
            transform: rotateY(-160deg);
        }

        /* Estilo general para las caras */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            padding: 40px;
            box-sizing: border-box;
            border: 2px solid #ff85a2;
        }

        /* Cara frontal (la tapa) */
        .front {
            background-color: #ff85a2;
            z-index: 2;
            color: white;
        }

        .front h2 {
            font-size: 32px;
            text-align: center;
            margin: 0;
        }

        .front .heart-icon {
            font-size: 80px;
            margin-top: 20px;
        }

        /* Cara interior (donde está el mensaje) */
        .back {
            background-color: #fff;
            transform: rotateY(180deg);
            z-index: 1;
            text-align: center;
        }

        .back h1 {
            color: #d81b60;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .back p {
            font-size: 22px;
            color: #555;
            line-height: 1.5;
        }

        .cake-emoji {
            font-size: 70px;
            margin: 20px 0;
        }

        .love-text {
            color: #ff1493;
            font-weight: bold;
            font-size: 24px;
            margin-top: 20px;
        }

        /* Instrucción pequeña abajo */
        .instruction {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            color: #ff85a2;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-inner">
            <!-- Portada de la carta -->
            <div class="front">
                <h2>¡Tengo una sorpresa para vos!</h2>
                <div class="heart-icon">💗</div>
            </div>

            <!-- Interior de la carta -->
            <div class="back">
                <h1>¡Feliz Cumple mi niña!</h1>
                <p>Que la pases muy lindo en tu día...</p>
                <div class="cake-emoji">🎂</div>
                <div class="love-text">T amo muchooooo 💗</div>
            </div>
        </div>
        <div class="instruction">Pasa el ratón (o toca) para abrir ➔</div>
    </div>

</body>
</html>
